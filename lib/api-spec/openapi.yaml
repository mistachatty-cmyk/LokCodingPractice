openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: live-studio
    description: Safe rotating Live Studio challenge operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /live-studio/challenge:
    post:
      operationId: generateLiveStudioChallenge
      tags: [live-studio]
      summary: Generate a validated Live Studio challenge draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveStudioChallengeRequest"
      responses:
        "200":
          description: Generated challenge contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStudioChallengeResponse"
        "400":
          description: Invalid request
        "503":
          description: Generator unavailable or draft rejected
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LiveStudioChallengeRequest:
      type: object
      properties:
        cadence:
          type: string
          enum: [Daily, Weekly, Monthly]
        tier:
          type: string
          enum: [Small, Medium, Hard, Advanced, Legendary]
        periodKey:
          type: string
          pattern: "^\\d{4}-\\d{2}(-\\d{2})?$"
      required: [cadence, tier, periodKey]
    LiveStudioChallenge:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        language:
          type: string
          enum: [TypeScript, JavaScript, SQL, Shell, Python, React]
        tier:
          type: string
          enum: [Small, Medium, Hard, Advanced, Legendary]
        code: { type: string }
        description: { type: string }
        objective: { type: string }
        visualizer:
          type: string
          enum: [counter, palette, tasks, terminal, rankings]
        visualizerData:
          type: object
          properties:
            labels:
              type: array
              items: { type: string }
            colors:
              type: array
              items: { type: string }
        estimatedSeconds:
          type: number
          description: Whole seconds for the target estimate
      required: [id, title, language, tier, code, visualizer]
    LiveStudioChallengeResponse:
      type: object
      properties:
        challenge:
          $ref: "#/components/schemas/LiveStudioChallenge"
        source:
          type: string
          enum: [generated]
      required: [challenge, source]

